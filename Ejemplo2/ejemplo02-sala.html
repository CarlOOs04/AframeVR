<!DOCTYPE html>
<html>
<head>
<title>Sala de Museo Virtual</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" material="src: ./images/wood_floor.jpg"> </a-plane>
    <!-- Pared frontal -->
    <a-box position="0 1.5 -5" width="10" height="3" depth="0.3" material="src: ./images/painted_wall.jpg; repeat: 10 3"></a-box>
    <!-- Pared trasera -->
    <a-box position="0 1.5 5" width="10" height="3" depth="0.3" material="src: ./images/painted_wall.jpg; repeat: 10 3"></a-box>
    <!-- Pared izquierda -->
    <a-box position="-5 1.5 0" rotation="0 90 0" width="10" height="3" depth="0.3" material="src: ./images/painted_wall.jpg; repeat: 10 3"></a-box>
    <!-- Pared derecha -->
    <a-box position="5 1.5 0" rotation="0 -90 0" width="10" height="3" depth="0.3" material="src: ./images/painted_wall.jpg; repeat: 10 3"></a-box>
    <!-- Cielo (fondo) -->
    <a-sky color="#ECECEC"></a-sky>
    <!-- Cuadro de ejemplo en la pared frontal -->
    <a-image position="0 1.5 -4.5" src="./images/monalisa.jpeg" width="1.5" height="2"></a-image>
    <a-assets><a-asset-item id="discobolus" src="./discobolus/scene.gltf"></a-asset-item></a-assets>
    <a-entity position="-2 -0.2 -3" scale="0.2 0.2 0.2" gltf-model="#discobolus"></a-entity>
    <a-assets><a-asset-item id="america" src="./captainamerica/scene.gltf"></a-asset-item></a-assets>
    <a-entity position="2 0 -3" scale="0.15 0.15 0.15" gltf-model="#america"></a-entity>
</a-scene>
</body>
</html>
