<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Sala 360° - Centro de Datos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
  <style>body{margin:0;font-family:system-ui,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <a-scene background="color: #000" embedded>
    <a-assets>
      <img id="sala360" src="assets/360/sala-servidores-360.jpg" crossorigin="anonymous" />
      <audio id="voice" src="assets/sounds/voice-guide.mp3"></audio>
      <audio id="bg" src="assets/sounds/bg-ambience.mp3" preload="auto"></audio>
    </a-assets>

    <a-sky src="#sala360" rotation="0 -90 0"></a-sky>

    <a-entity id="cameraRig">
      <a-entity camera look-controls position="0 1.6 0">
        <a-entity cursor="fuse: false; rayOrigin: mouse"
                  raycaster="objects: .clickable"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                  material="shader: flat; opacity: 0.9">
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="hotspots">
      <a-cylinder class="clickable" position="2 1.2 -3" height="0.05" radius="0.4"
                  material="color:#0b84ff; opacity:0.95"
                  event-set__enter="_event: mouseenter; scale: 1.1 1.1 1.1"
                  event-set__leave="_event: mouseleave; scale: 1 1 1"
                  onclick="location.href='escena-rack.html'">
        <a-text value="Ir al Rack" align="center" position="0 0.45 0" color="#fff" width="2"></a-text>
      </a-cylinder>

      <a-cylinder class="clickable" position="-2 1.2 -3" height="0.05" radius="0.4"
                  material="color:#22c55e; opacity:0.95"
                  event-set__enter="_event: mouseenter; scale: 1.1 1.1 1.1"
                  event-set__leave="_event: mouseleave; scale: 1 1 1"
                  onclick="location.href='escena-servidor.html'">
        <a-text value="Configurar Servidor" align="center" position="0 0.45 0" color="#fff" width="2"></a-text>
      </a-cylinder>
    </a-entity>

    <a-entity sound="src: #bg; autoplay: true; loop: true; volume: 0.35"></a-entity>

    <a-entity position="-1.6 1.0 -1.4">
      <a-plane width="1.8" height="0.7" material="color:#071026; opacity:0.9"></a-plane>
      <a-text value="Sala de servidores — Haz click en las zonas para avanzar" wrap-count="30" color="#9fd1ff" position="-0.82 0.15 0.01"></a-text>
    </a-entity>

    <a-entity light="type: ambient; intensity:0.6"></a-entity>
    <a-entity light="type: directional; intensity:0.6" position="0 10 -5"></a-entity>
  </a-scene>
</body>
</html>
