<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Sala 360° con Físicas</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.1.0/dist/aframe-physics-system.min.js"></script>
</head>
<body>

    <a-scene physics="debug: false">
        <a-assets>
            <a-asset-item id="room-model" src="assets/models/server_room.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 1.6 0" kinematic-body look-controls wasd-controls>
            <a-cursor></a-cursor>
        </a-camera>

        <a-entity gltf-model="#room-model" position="0 0 0"></a-entity>

        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" visible="false" static-body></a-plane>

        <a-box position="0 2 -10" width="20" height="5" depth="0.1" visible="false" color="red" static-body></a-box>
        <a-box position="0 2 10" width="20" height="5" depth="0.1" visible="false" color="red" static-body></a-box>
        <a-box position="10 2 0" width="0.1" height="5" depth="20" visible="false" color="red" static-body></a-box>
        <a-box position="-10 2 0" width="0.1" height="5" depth="20" visible="false" color="red" static-body></a-box>

    </a-scene>
</body>
</html>
