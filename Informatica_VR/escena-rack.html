<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Rack Interactivo - Centro de Datos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
  <style>body{margin:0;font-family:system-ui,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <a-scene embedded>
    <a-assets>
      <a-asset-item id="rackModel" src="assets/models/rack-lowpoly.glb"></a-asset-item>
      <img id="floorTex" src="assets/textures/floor.jpg" />
      <audio id="clickSfx" src="assets/sounds/click.mp3"></audio>
    </a-assets>

    <a-entity id="cameraRig">
      <a-entity camera position="0 1.6 3" look-controls>
        <a-entity cursor="fuse: true; fuseTimeout: 800"
                  raycaster="objects: .clickable"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                  material="shader: flat; opacity: 0.9"></a-entity>
      </a-entity>
    </a-entity>

    <a-plane rotation="-90 0 0" width="20" height="20" src="#floorTex" repeat="10 10"></a-plane>
    <a-entity light="type: ambient; intensity:0.45"></a-entity>
    <a-entity light="type: spot; intensity:0.9; angle:30" position="0 6 3"></a-entity>

    <a-entity position="0 0 -1.5">
      <a-gltf-model src="#rackModel" scale="1 1 1" rotation="0 180 0" shadow="cast: true" class="interactive-model"></a-gltf-model>
    </a-entity>

    <a-sphere class="clickable hotspot" position="0 1.6 -1.2" radius="0.06"
              material="color:#ffb300; opacity:0.95"
              event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3"
              event-set__leave="_event: mouseleave; scale: 1 1 1"
              onclick="showInfo('U: Unidad 3 - SSD 1TB - Estado: OK')">
      <a-text value="Unidad 3" align="center" position="0 0.25 0" color="#000" width="1.4"></a-text>
    </a-sphere>

    <a-sphere class="clickable hotspot" position="-0.45 1.2 -1.28" radius="0.06"
              material="color:#ef4444; opacity:0.95"
              onclick="showInfo('U: Fuente PSU - Temperatura alta (75°C)')">
      <a-text value="PSU" align="center" position="0 0.25 0" color="#000" width="1.2"></a-text>
    </a-sphere>

    <a-entity id="infoPanel" visible="false" position="1.6 1.2 -1.2">
      <a-plane width="1.2" height="0.7" color="#111" opacity="0.92"></a-plane>
      <a-text id="infoText" value="" position="-0.54 0.15 0.01" wrap-count="30" color="#fff"></a-text>
      <a-box position="0.45 -0.22 0.01" width="0.2" height="0.12" depth="0.02" color="#0b84ff"
             class="clickable" onclick="document.getElementById('infoPanel').setAttribute('visible','false')">
        <a-text value="Cerrar" align="center" position="-0.08 -0.04 0.03" color="#fff"></a-text>
      </a-box>
    </a-entity>

    <a-entity position="-1.7 1.8 -1.2">
      <a-box width="0.6" height="0.2" depth="0.05" color="#0b84ff" class="clickable"
             onclick="location.href='index.html'">
        <a-text value="Volver" align="center" position="-0.26 -0.05 0.03"></a-text>
      </a-box>
    </a-entity>

    <script>
      function showInfo(text) {
        const panel = document.getElementById('infoPanel');
        const info = document.getElementById('infoText');
        info.setAttribute('value', text);
        panel.setAttribute('visible', true);
      }
      document.addEventListener('DOMContentLoaded', () => {
        const hotspots = Array.from(document.querySelectorAll('.hotspot'));
        hotspots.forEach(h => {
          h.addEventListener('mouseenter', () => { h.object3D.scale.set(1.2,1.2,1.2); });
          h.addEventListener('mouseleave', () => { h.object3D.scale.set(1,1,1); });
        });
      });
    </script>
  </a-scene>
</body>
</html>
