<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Rack Interactivo - Data Center</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.1.0/dist/aframe-physics-system.min.js"></script>
    <style>
        body{
            background-color: grey;
        }
        #info-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 20, 0.95);
            color: #00ff00;
            padding: 30px;
            border: 2px solid #00ff00;
            border-radius: 15px;
            font-family: 'Courier New', monospace;
            display: none;
            z-index: 1000;
            width: 400px;
        }

        .close-btn {
            color: #ff0000;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            display: block;
            text-align: right;
        }

        .data-row {
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
    </style>
</head>

<body>

    <div id="info-panel">
        <div id="info-content"></div>
        <span class="close-btn" onclick="document.getElementById('info-panel').style.display='none'">[CERRAR]</span>
    </div>

    <a-scene physics="debug: false" cursor="rayOrigin: mouse" raycaster="objects: .hotspot">
        <a-assets>
            <a-asset-item id="rack-model" src="assets/models/server_rack.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 1.6 3" kinematic-body look-controls wasd-controls>
            <a-cursor></a-cursor>
        </a-camera>

        <a-entity gltf-model="#rack-model" position="0 1.5 0" rotation="0 180 0" static-body></a-entity>
        <a-plane rotation="-90 0 0" width="20" height="20" visible="false" static-body></a-plane>

        <a-box class="hotspot" position="0 1.5 0.3" width="0.5" height="0.1" depth="0.1" opacity="0"
            data-modelo="CISCO ASR 9000" data-ip="192.168.1.10" data-estado="OPERATIVO" data-temp="42°C"></a-box>

        <a-box class="hotspot" position="0 1.3 0.3" width="0.5" height="0.1" depth="0.1" opacity="0"
            data-modelo="CISCO Nexus 7000" data-ip="192.168.1.11" data-estado="ADVERTENCIA" data-temp="68°C"></a-box>
    </a-scene>

    <script>
        const panel = document.getElementById('info-panel');
        const content = document.getElementById('info-content');

        document.querySelectorAll('.hotspot').forEach(btn => {
            btn.addEventListener('click', () => {
                content.innerHTML = `
                    <div class="data-row"><strong>EQUIPO:</strong> ${btn.getAttribute('data-modelo')}</div>
                    <div class="data-row"><strong>IP:</strong> ${btn.getAttribute('data-ip')}</div>
                    <div class="data-row"><strong>ESTADO:</strong> ${btn.getAttribute('data-estado')}</div>
                    <div class="data-row"><strong>TEMPERATURA:</strong> ${btn.getAttribute('data-temp')}</div>
                `;
                panel.style.display = 'block';
            });
        });
    </script>
</body>

</html>
