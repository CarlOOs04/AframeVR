<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Servidor Configurable - Centro de Datos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 8px;
            color: #0b84ff;
            font-family: system-ui;
            font-size: 13px;
            z-index: 999;
            max-width: 350px;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
        }

        #controls label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }

        #controls input {
            margin-right: 8px;
        }

        a.btn-back {
            position: fixed;
            bottom: 200px;
            left: 20px;
            padding: 12px 16px;
            background: #0b84ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: system-ui;
            font-size: 13px;
        }

        #stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            color: #ff6600;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <div id="ui">
        <strong>Servidor Configurable</strong><br />
        <p>Sistema HP ProLiant DL380 Gen10<br />
            Panel de control en tiempo real</p>
        <p style="font-size:11px; color:#888;">
            Modifica los interruptores para cambiar estado del servidor
        </p>
    </div>

    <div id="controls">
        <strong>⚙️ PANEL DE CONTROL</strong><br />
        <label><input type="checkbox" id="cpu-toggle"> CPU: <span id="cpu-status">OFF</span></label>
        <label><input type="checkbox" id="ram-toggle"> RAM: <span id="ram-status">OFF</span></label>
        <label><input type="checkbox" id="disk-toggle"> HDD: <span id="disk-status">OFF</span></label>
        <label><input type="checkbox" id="cooling-toggle"> Refrigeración: <span id="cooling-status">OFF</span></label>
        <label><input type="checkbox" id="power-toggle"> Alimentación: <span id="power-status">OFF</span></label>
    </div>

    <div id="stats">
        <strong>📊 ESTADÍSTICAS</strong><br />
        CPU: <span id="cpu-temp">0</span>°C<br />
        RAM: <span id="ram-usage">0</span>GB / 256GB<br />
        Disco: <span id="disk-usage">0</span>% lleno<br />
        Red: <span id="net-speed">0</span> Mbps
    </div>

    <a href="index.html" class="btn-back">← Volver al menú</a>

    <a-scene background="color:#000000">
        <a-sky color="#0a0a0a"></a-sky>

        <!-- Luces -->
        <a-light type="ambient" color="#ffffff" intensity="0.4"></a-light>
        <a-light type="directional" color="#0b84ff" intensity="0.7" position="2 4 2"></a-light>

        <!-- Cámara -->
        <a-camera position="0 1.6 2.5"></a-camera>

        <!-- Suelo -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#0a0a0a" metalness="0.7"></a-plane>

        <!-- SERVIDOR PRINCIPAL: HP ProLiant DL380 Gen10 -->
        <a-group position="0 0.8 -1.5">
            <!-- Chasis principal -->
            <a-box id="chassis" position="0 1 0" width="1" height="1.8" depth="1.2" color="#1a1a1a" metalness="0.8"
                roughness="0.2"></a-box>

            <!-- Pantalla frontal (LED de estado) -->
            <a-box id="led-power" position="0 1.6 0.61" width="0.1" height="0.1" depth="0.05" color="#ff0000"
                event-set__enter="_event: mouseenter; color: #ff4444"></a-box>
            <a-text position="-0.3 1.6 0.7" value="PWR" color="#ff0000" scale="0.4 0.4 0.4"></a-text>

            <a-box id="led-cpu" position="0 1.4 0.61" width="0.1" height="0.1" depth="0.05" color="#1a1a1a"
                event-set__enter="_event: mouseenter; color: #00ff00"></a-box>
            <a-text position="-0.3 1.4 0.7" value="CPU" color="#888" scale="0.4 0.4 0.4"></a-text>

            <a-box id="led-disk" position="0 1.2 0.61" width="0.1" height="0.1" depth="0.05" color="#1a1a1a"
                event-set__enter="_event: mouseenter; color: #00ff00"></a-box>
            <a-text position="-0.3 1.2 0.7" value="HDD" color="#888" scale="0.4 0.4 0.4"></a-text>

            <!-- Panel de conectores (simulado) -->
            <a-box position="0 0.3 0.61" width="0.8" height="0.3" depth="0.05" color="#333"></a-box>
            <a-text position="0 0.35 0.7" value="CONEXIONES" color="#666" scale="0.35 0.35 0.35"
                anchor="center"></a-text>

            <!-- Puertos de conexión -->
            <a-sphere position="-0.3 0.3 0.65" radius="0.04" color="#ffff00"></a-sphere>
            <a-sphere position="-0.15 0.3 0.65" radius="0.04" color="#ffff00"></a-sphere>
            <a-sphere position="0 0.3 0.65" radius="0.04" color="#ffff00"></a-sphere>
            <a-sphere position="0.15 0.3 0.65" radius="0.04" color="#ffff00"></a-sphere>
            <a-sphere position="0.3 0.3 0.65" radius="0.04" color="#ffff00"></a-sphere>

            <!-- Etiqueta del servidor -->
            <a-text position="0 -0.3 1.2" value="HP ProLiant DL380 Gen10" color="#0b84ff" scale="0.6 0.6 0.6"
                anchor="center"></a-text>
            <a-text position="0 -0.6 1.2"
                value="Procesadores: 2x Xeon Gold 6240 | RAM: 256GB | Almacenamiento: 12x 2.4TB SAS" color="#888"
                scale="0.35 0.35 0.35" anchor="center" width="4"></a-text>
        </a-group>

        <!-- COMPONENTES INTERNOS (visualización) -->
        <a-group position="-2 0.8 -1.5">
            <!-- CPU -->
            <a-box id="cpu-visual" position="0 1.2 0" width="0.6" height="0.4" depth="0.6" color="#ff6600" opacity="0.6"
                event-set__enter="_event: mouseenter; color: #ffaa00; opacity: 0.8"></a-box>
            <a-text position="0 0.5 0" value="DUAL XEON" color="#ff6600" scale="0.5 0.5 0.5" anchor="center"></a-text>
        </a-group>

        <a-group position="-0.5 0.8 -1.5">
            <!-- Memoria RAM -->
            <a-box id="ram-visual" position="0 1.2 0" width="0.4" height="1.5" depth="0.4" color="#00ff00" opacity="0.6"
                event-set__enter="_event: mouseenter; color: #00ffaa; opacity: 0.8"></a-box>
            <a-text position="0 0.3 0" value="256GB\nRAM" color="#00ff00" scale="0.4 0.4 0.4" anchor="center"></a-text>
        </a-group>

        <a-group position="1 0.8 -1.5">
            <!-- Almacenamiento -->
            <a-box id="disk-visual" position="0 1 0" width="0.5" height="0.8" depth="0.8" color="#00ccff" opacity="0.6"
                event-set__enter="_event: mouseenter; color: #00ffff; opacity: 0.8"></a-box>
            <a-text position="0 0.2 0" value="12x 2.4TB\nSAS" color="#00ccff" scale="0.35 0.35 0.35"
                anchor="center"></a-text>
        </a-group>

        <a-group position="2.5 0.8 -1.5">
            <!-- Sistema de refrigeración -->
            <a-cylinder id="cooling-visual" position="0 1.2 0" radius="0.25" height="1.2" color="#0b84ff" opacity="0.6"
                event-set__enter="_event: mouseenter; color: #00ffff; opacity: 0.8"></a-cylinder>
            <a-text position="0 0.3 0.3" value="COOLING" color="#0b84ff" scale="0.4 0.4 0.4" anchor="center"></a-text>
        </a-group>

        <!-- Panel de información superior -->
        <a-text position="0 2.5 -1.5" value="ESTADO DEL SISTEMA: TODOS LOS COMPONENTES INACTIVOS" color="#ff0000"
            scale="0.6 0.6 0.6" anchor="center"></a-text>
    </a-scene>

    <script>
        // Variables de estado
        let state = {
            power: false,
            cpu: false,
            ram: false,
            disk: false,
            cooling: false
        };

        // Elementos visuales
        const visuals = {
            cpu: document.querySelector('#cpu-visual'),
            ram: document.querySelector('#ram-visual'),
            disk: document.querySelector('#disk-visual'),
            cooling: document.querySelector('#cooling-visual'),
            power: document.querySelector('#led-power'),
            cpuLed: document.querySelector('#led-cpu'),
            diskLed: document.querySelector('#led-disk'),
            status: document.querySelector('a-text:nth-of-type(last-child)')
        };

        // Controles
        const toggles = {
            cpu: document.querySelector('#cpu-toggle'),
            ram: document.querySelector('#ram-toggle'),
            disk: document.querySelector('#disk-toggle'),
            cooling: document.querySelector('#cooling-toggle'),
            power: document.querySelector('#power-toggle')
        };

        // Actualizar estado visual
        function updateUI() {
            // Estados
            Object.keys(state).forEach(key => {
                document.getElementById(key + '-status').textContent = state[key] ? 'ON' : 'OFF';
            });

            // Colores
            if (state.power) {
                visuals.power.setAttribute('color', '#00ff00');
            } else {
                visuals.power.setAttribute('color', '#ff0000');
            }

            if (state.cpu && state.power) {
                visuals.cpu.setAttribute('opacity', 0.9);
                visuals.cpu.setAttribute('color', '#ffff00');
                visuals.cpuLed.setAttribute('color', '#00ff00');
            } else {
                visuals.cpu.setAttribute('opacity', 0.3);
                visuals.cpu.setAttribute('color', '#ff6600');
                visuals.cpuLed.setAttribute('color', '#1a1a1a');
            }

            if (state.ram && state.power) {
                visuals.ram.setAttribute('opacity', 0.9);
                visuals.ram.setAttribute('color', '#00ffff');
            } else {
                visuals.ram.setAttribute('opacity', 0.3);
                visuals.ram.setAttribute('color', '#00ff00');
            }

            if (state.disk && state.power) {
                visuals.disk.setAttribute('opacity', 0.9);
                visuals.disk.setAttribute('color', '#ffff00');
                visuals.diskLed.setAttribute('color', '#00ff00');
            } else {
                visuals.disk.setAttribute('opacity', 0.3);
                visuals.disk.setAttribute('color', '#00ccff');
                visuals.diskLed.setAttribute('color', '#1a1a1a');
            }

            if (state.cooling && state.power) {
                visuals.cooling.setAttribute('opacity', 0.9);
                visuals.cooling.setAttribute('color', '#00ffff');
            } else {
                visuals.cooling.setAttribute('opacity', 0.3);
                visuals.cooling.setAttribute('color', '#0b84ff');
            }

            // Mensaje de estado
            let msg = 'ESTADO: ';
            if (!state.power) {
                msg += 'APAGADO';
            } else if (state.cpu && state.ram && state.disk && state.cooling) {
                msg += '✓ TOTALMENTE OPERATIVO';
            } else {
                msg += 'PARCIALMENTE ACTIVO';
            }

            // Estadísticas
            updateStats();
        }

        function updateStats() {
            const power = state.power ? 1 : 0;
            const cpu = state.cpu ? 1 : 0;
            const ram = state.ram ? 1 : 0;
            const disk = state.disk ? 1 : 0;

            document.getElementById('cpu-temp').textContent = Math.round(35 + cpu * 65 + Math.random() * 10);
            document.getElementById('ram-usage').textContent = Math.round(ram * 220 + Math.random() * 20);
            document.getElementById('disk-usage').textContent = Math.round(disk * 75 + Math.random() * 15);
            document.getElementById('net-speed').textContent = Math.round(power * 1000 + Math.random() * 200);
        }

        // Event listeners
        toggles.power.addEventListener('change', () => {
            state.power = toggles.power.checked;
            updateUI();
        });

        toggles.cpu.addEventListener('change', () => {
            if (state.power) state.cpu = toggles.cpu.checked;
            else toggles.cpu.checked = false;
            updateUI();
        });

        toggles.ram.addEventListener('change', () => {
            if (state.power) state.ram = toggles.ram.checked;
            else toggles.ram.checked = false;
            updateUI();
        });

        toggles.disk.addEventListener('change', () => {
            if (state.power) state.disk = toggles.disk.checked;
            else toggles.disk.checked = false;
            updateUI();
        });

        toggles.cooling.addEventListener('change', () => {
            if (state.power) state.cooling = toggles.cooling.checked;
            else toggles.cooling.checked = false;
            updateUI();
        });

        // Inicializar
        updateUI();
    </script>
</body>

</html>
